# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
version: '3'
includes:
  gen:
    taskfile: ./taskfile-generated.yml
    internal: true
tasks:
  build_rust:
    desc: Build Rust project and package release tarball (requires PROJECT_NAME)
    cmds:
      - task: gen:build_rust.sh
        vars:
          PROJECT_NAME: '{{.PROJECT_NAME}}'
    requires:
      vars: [PROJECT_NAME]
  notarize_macos:
    desc: Notarize macOS binary with Apple notarytool (requires PROJECT_NAME + Apple/CircleCI env)
    platforms: [darwin]
    cmds:
      - task: gen:notarize_macos.sh
        vars:
          PROJECT_NAME: '{{.PROJECT_NAME}}'
    requires:
      vars: [PROJECT_NAME, APPLE_API_KEY_CONTENT, APPLE_API_KEY_ID, APPLE_ISSUER_ID, CIRCLECI_PUBLISH_WEBHOOK_SECRET]
