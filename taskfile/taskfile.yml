# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
# Manual tasks for the reusable snippets Taskfile.
# Script tasks (gen:<name>.sh) are inserted at the placeholder below by
# scripts/generate_taskfile.sh — DO NOT EDIT taskfile.yml directly.
version: '3'
tasks:
  build_rust:
    desc: Build Rust project and package release tarball (requires PROJECT_NAME)
    cmds:
      - task: gen:build_rust.sh
        vars:
          PROJECT_NAME: '{{.PROJECT_NAME}}'
    requires:
      vars: [PROJECT_NAME]
  notarize_macos:
    desc: Submit macOS binary to Apple notarytool, record submission in /tmp/notarization/info.json (requires PROJECT_NAME + Apple env)
    platforms: [darwin]
    cmds:
      - task: gen:notarize_macos.sh
        vars:
          PROJECT_NAME: '{{.PROJECT_NAME}}'
    requires:
      vars: [PROJECT_NAME, APPLE_API_KEY_CONTENT, APPLE_API_KEY_ID, APPLE_ISSUER_ID]
  sign_macos:
    desc: Sign macOS binary with Developer ID certificate and repackage signed tarball (requires PROJECT_NAME + Apple signing env)
    platforms: [darwin]
    cmds:
      - task: gen:sign_macos.sh
        vars:
          PROJECT_NAME: '{{.PROJECT_NAME}}'
    requires:
      vars: [PROJECT_NAME, APPLE_CERTIFICATE, APPLE_CERT_PASSWORD]
  validate_notarization:
    desc: Validate Apple notarization result from /tmp/notarization/info.json via rcodesign (requires Apple env)
    cmds:
      - task: gen:validate_notarization.sh
    requires:
      vars: [APPLE_API_KEY_CONTENT, APPLE_API_KEY_ID, APPLE_ISSUER_ID]
  gen:build_rust.sh:
    internal: true
    silent: true
    cmd: |
      # Build a Rust project for the host OS/arch Rust target triple.
      # Call with PROJECT_NAME set, e.g. `task build_rust PROJECT_NAME=myapp`.
      set -euo pipefail

      PROJECT_NAME="{{.PROJECT_NAME}}"
      if [[ -z ${PROJECT_NAME} ]]; then
      	echo "PROJECT_NAME is required (call with PROJECT_NAME=<name>)" >&2
      	exit 1
      fi

      # Resolve OS and arch
      OS=$(uname -s | tr '[:upper:]' '[:lower:]')
      case "$OS" in
      darwin) OS="apple" ;;
      linux) OS="linux" ;;
      *)
      	echo "Unsupported OS: $OS"
      	exit 1
      	;;
      esac

      ARCH=$(uname -m)
      case "$ARCH" in
      x86_64) ARCH="amd64" ;;
      aarch64 | arm64) ARCH="arm64" ;;
      *)
      	echo "Unsupported arch: $ARCH"
      	exit 1
      	;;
      esac

      # Resolve Rust target triple
      case "$OS-$ARCH" in
      linux-amd64) RUST_TARGET="x86_64-unknown-linux-musl" ;;
      linux-arm64) RUST_TARGET="aarch64-unknown-linux-musl" ;;
      apple-amd64) RUST_TARGET="x86_64-apple-darwin" ;;
      apple-arm64) RUST_TARGET="aarch64-apple-darwin" ;;
      *)
      	echo "Unsupported OS/arch combination: $OS-$ARCH"
      	exit 1
      	;;
      esac

      NAME="$PROJECT_NAME-$RUST_TARGET"
      TARBALL="release/$NAME.tar.gz"

      mkdir -p release

      # Ensure the musl C toolchain is present for musl targets.
      # cc-rs (e.g. aws-lc-sys) probes for <target>-gcc and fails with
      # ToolNotFound when musl-tools/musl-dev are missing on Debian images
      # (cimg/base, ubuntu-2204). musl-dev ships the wrapper, so once the
      # packages are installed the compiler is picked up automatically.
      case "$RUST_TARGET" in
      *-unknown-linux-musl)
      	MUSL_CC=""
      	case "$RUST_TARGET" in
      	x86_64-*) MUSL_CC="x86_64-linux-musl-gcc" ;;
      	aarch64-*) MUSL_CC="aarch64-linux-musl-gcc" ;;
      	esac
      	if ! command -v "$MUSL_CC" >/dev/null 2>&1 && ! command -v musl-gcc >/dev/null 2>&1; then
      		if command -v apt-get >/dev/null 2>&1; then
      			if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; else SUDO=""; fi
      			$SUDO apt-get update && $SUDO apt-get install -y musl-tools musl-dev
      		else
      			echo "warning: $MUSL_CC not found and apt-get unavailable (musl build may fail)" >&2
      		fi
      	fi
      	;;
      esac

      # Install target & precompiled std & build release
      rustup target add "$RUST_TARGET"
      rustup component add rust-std --target "$RUST_TARGET"
      cargo build --release --target "$RUST_TARGET"

      tar -czf "$TARBALL" -C "target/$RUST_TARGET/release" "$PROJECT_NAME"
      echo "Created: $TARBALL"

      # Copy unpacked binary for downstream tasks (stable path, no re-resolution needed)
      mkdir -p tmp/binary
      cp "target/$RUST_TARGET/release/$PROJECT_NAME" "tmp/binary/$PROJECT_NAME"
      echo "Copied: tmp/binary/$PROJECT_NAME"
  gen:notarize_macos.sh:
    internal: true
    silent: true
    cmd: |
      # Notarize a macOS binary with Apple notarytool.
      # Expects tmp/binary/PROJECT_NAME from the build_rust task.
      # Call with PROJECT_NAME set, e.g. `task notarize_macos PROJECT_NAME=myapp`.
      # Requires Apple credentials in the environment (provided by fnox).
      # Records the submission in /tmp/notarization/info.json for the
      # validate_notarization task (the client persists that file between jobs).
      set -euo pipefail

      PROJECT_NAME="{{.PROJECT_NAME}}"
      if [[ -z ${PROJECT_NAME} ]]; then
      	echo "PROJECT_NAME is required (call with PROJECT_NAME=<name>)" >&2
      	exit 1
      fi

      : "${APPLE_API_KEY_CONTENT:?APPLE_API_KEY_CONTENT is required in the environment}"
      : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID is required in the environment}"
      : "${APPLE_ISSUER_ID:?APPLE_ISSUER_ID is required in the environment}"

      mkdir -p tmp/binary /tmp/notarization
      # Use ditto (not zip -j) so the code signature's extended attributes
      # and resource forks survive archiving.
      ditto -c -k "tmp/binary/$PROJECT_NAME" "tmp/binary/$PROJECT_NAME.zip"

      # Write the API key to a regular file: Task runs cmds via the mvdan/sh
      # Go interpreter, whose <(...) process substitution becomes a
      # sh-interp-* FIFO that sandboxed Apple binaries (notarytool) cannot
      # open. A real temp file works everywhere.
      # NOTE: mvdan/sh only supports `trap ... EXIT` (no INT/TERM), so keep
      # EXIT-only for Task compatibility; real bash also accepts it.
      KEY_FILE="$(mktemp /tmp/AuthKey_XXXXXX.p8)"
      chmod 600 "$KEY_FILE"
      trap 'rm -f "$KEY_FILE"' EXIT
      printf '%s' "$APPLE_API_KEY_CONTENT" >"$KEY_FILE"

      xcrun notarytool submit "tmp/binary/$PROJECT_NAME.zip" \
      	--key "$KEY_FILE" \
      	--key-id "$APPLE_API_KEY_ID" \
      	--issuer "$APPLE_ISSUER_ID" \
      	--output-format json | tee /tmp/notarization/info.json

      SUBMISSION_ID=$(jq -r '.id' /tmp/notarization/info.json)
      echo "Submitted: $SUBMISSION_ID"
      rm -f "$KEY_FILE"
  gen:sign_macos.sh:
    internal: true
    silent: true
    cmd: |
      # Sign a macOS binary with a Developer ID Application certificate.
      # Expects tmp/binary/PROJECT_NAME from the build_rust task.
      # Call with PROJECT_NAME set, e.g. `task sign_macos PROJECT_NAME=myapp`.
      # Requires signing credentials in the environment (provided by fnox).
      # Overwrites release/<name>.tar.gz with the signed binary so downstream
      # `gh release upload` publishes the signed asset. Notarization itself is
      # not stapled here and remains a separate step.
      set -euo pipefail

      PROJECT_NAME="{{.PROJECT_NAME}}"
      if [[ -z ${PROJECT_NAME} ]]; then
      	echo "PROJECT_NAME is required (call with PROJECT_NAME=<name>)" >&2
      	exit 1
      fi

      : "${APPLE_CERTIFICATE:?APPLE_CERTIFICATE is required in the environment (base64-encoded .p12)}"
      : "${APPLE_CERT_PASSWORD:?APPLE_CERT_PASSWORD is required in the environment}"

      # Ephemeral keychain password: the keychain lives only for this job run,
      # so invent a random password per run instead of storing one in Infisical.
      KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

      # Resolve Rust target triple (same mapping as build_rust.sh) so we can
      # overwrite the matching release tarball with the signed binary.
      OS=$(uname -s | tr '[:upper:]' '[:lower:]')
      case "$OS" in
      darwin) OS="apple" ;;
      *)
      	echo "sign_macos is only supported on macOS (got: $OS)" >&2
      	exit 1
      	;;
      esac

      ARCH=$(uname -m)
      case "$ARCH" in
      x86_64) ARCH="amd64" ;;
      aarch64 | arm64) ARCH="arm64" ;;
      *)
      	echo "Unsupported arch: $ARCH"
      	exit 1
      	;;
      esac

      case "$OS-$ARCH" in
      apple-amd64) RUST_TARGET="x86_64-apple-darwin" ;;
      apple-arm64) RUST_TARGET="aarch64-apple-darwin" ;;
      *)
      	echo "Unsupported OS/arch combination: $OS-$ARCH"
      	exit 1
      	;;
      esac

      NAME="$PROJECT_NAME-$RUST_TARGET"
      TARBALL="release/$NAME.tar.gz"
      BINARY="tmp/binary/$PROJECT_NAME"

      if [[ ! -f ${BINARY} ]]; then
      	echo "${BINARY} not found (run build_rust first)" >&2
      	exit 1
      fi

      # NOTE: mvdan/sh (Task's interpreter) only supports `trap ... EXIT`
      # (no INT/TERM), so keep EXIT-only for Task compatibility.
      CERT_FILE="$(mktemp /tmp/AppleCert_XXXXXX.p12)"
      chmod 600 "$CERT_FILE"
      INTERMED_DIR="$(mktemp -d)"
      KEYCHAIN="$HOME/Library/Keychains/build-sign.keychain-db"
      trap 'rm -rf "$INTERMED_DIR"; rm -f "$CERT_FILE"; security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true' EXIT
      printf '%s' "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_FILE"

      security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
      security set-keychain-settings -lut 21600 "$KEYCHAIN"
      security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      # Install Apple's Developer ID intermediate so the fresh keychain can build
      # a trusted chain. Without it `find-identity -p codesigning` reports
      # 0 valid identities even with the correct leaf+key (public cert, Apple PKI).
      curl -fsSL -o "$INTERMED_DIR/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
      security add-certificates -k "$KEYCHAIN" "$INTERMED_DIR/DeveloperIDG2CA.cer"

      security import "$CERT_FILE" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
      security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null 2>&1

      # Fail fast unless a valid Developer ID identity is present. `grep`
      # without -q reads all input (avoids grep -q + pipefail SIGPIPE).
      security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" >/dev/null ||
      	{
      		echo "error: no valid Developer ID identity (check certificate + G2 intermediate)" >&2
      		exit 1
      	}

      # Derive the signing SHA-1 at runtime from the just-imported keychain.
      IDENT_SHA="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk '{print $2}')"
      if [[ -z ${IDENT_SHA} ]]; then
      	echo "error: could not resolve Developer ID identity SHA-1" >&2
      	exit 1
      fi

      # Sign by SHA-1, derived at runtime from the just-imported keychain.
      codesign --keychain "$KEYCHAIN" --sign "$IDENT_SHA" \
      	--timestamp --options runtime \
      	--force --verbose \
      	"$BINARY"

      codesign --verify --deep --strict --verbose=2 "$BINARY"

      # `verify` passes for adhoc too, so gate on Authority instead.
      CODESIGN_INFO="$(codesign -dvv "$BINARY" 2>&1)"
      printf '%s\n' "$CODESIGN_INFO"
      case "$CODESIGN_INFO" in
      *"Authority=Developer ID Application"*) ;;
      *)
      	echo "error: signing did not produce a Developer ID signature (still adhoc?)" >&2
      	exit 1
      	;;
      esac

      # Overwrite the release tarball with the signed binary so the uploaded
      # release asset is signed. Contents (single top-level binary) match the
      # unsigned tarball layout from build_rust.sh.
      mkdir -p release
      tar -czf "$TARBALL" -C "tmp/binary" "$PROJECT_NAME"
      echo "Repackaged signed: $TARBALL"

      rm -rf "$INTERMED_DIR"
      rm -f "$CERT_FILE"
      security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
  gen:validate_notarization.sh:
    internal: true
    silent: true
    cmd: |
      # Validate an Apple notarization result for a previous notarytool submission.
      # Expects /tmp/notarization/info.json from the notarize_macos task
      # (the client persists that file between jobs) and Apple credentials
      # in the environment (provided by fnox). Waits for a terminal state with
      # rcodesign, fetches the submission log, and fails unless Accepted.
      set -euo pipefail

      : "${APPLE_API_KEY_CONTENT:?APPLE_API_KEY_CONTENT is required in the environment}"
      : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID is required in the environment}"
      : "${APPLE_ISSUER_ID:?APPLE_ISSUER_ID is required in the environment}"

      INFO_FILE="/tmp/notarization/info.json"
      if [[ ! -f ${INFO_FILE} ]]; then
      	echo "${INFO_FILE} not found (run notarize_macos first and persist it between jobs)" >&2
      	exit 1
      fi

      LOG_FILE=tmp/notarization/notary-log.json

      mkdir -p tmp/notarization

      # The submission record is available here
      jq . "${INFO_FILE}"

      # Extract submission ID (notarytool submit --output-format json structure)
      SUBMISSION_ID=$(jq -r '.id // .submission_id' "${INFO_FILE}")
      if [[ -z ${SUBMISSION_ID} || ${SUBMISSION_ID} == "null" ]]; then
      	echo "No submission ID found in ${INFO_FILE}" >&2
      	exit 1
      fi

      # Materialize credentials as regular files: Task runs cmds via the
      # mvdan/sh Go interpreter, whose <(...) becomes a sh-interp-* FIFO
      # that sandboxed tools cannot reliably open. Regular temp files work
      # everywhere (macOS notarytool path and Linux rcodesign path alike).
      # NOTE: mvdan/sh only supports `trap ... EXIT` (no INT/TERM), so keep
      # EXIT-only for Task compatibility; real bash also accepts it.
      KEY_FILE="$(mktemp /tmp/AuthKey_XXXXXX.p8)"
      chmod 600 "$KEY_FILE"
      ENCODED_FILE="$(mktemp /tmp/ApiKey_XXXXXX.json)"
      chmod 600 "$ENCODED_FILE"
      trap 'rm -f "$KEY_FILE" "$ENCODED_FILE"' EXIT
      printf '%s' "$APPLE_API_KEY_CONTENT" >"$KEY_FILE"
      rcodesign encode-app-store-connect-api-key \
      	-o "$ENCODED_FILE" \
      	"$APPLE_ISSUER_ID" \
      	"$APPLE_API_KEY_ID" \
      	"$KEY_FILE"

      # Block until Apple reaches a terminal state, then fetch the log for parsing
      rcodesign notary-wait \
      	--api-key-file "$ENCODED_FILE" "$SUBMISSION_ID"

      rcodesign notary-log \
      	--api-key-file "$ENCODED_FILE" "$SUBMISSION_ID" >"$LOG_FILE"

      STATUS=$(jq -r '.status // .attributes.status' $LOG_FILE)

      if [ "$STATUS" != "Accepted" ]; then
      	echo "Notarization failed: $STATUS"
      	cat $LOG_FILE
      	exit 1
      fi

      echo "Notarization Accepted"
      rm -f "$KEY_FILE" "$ENCODED_FILE"
