# * Backend Priority Order: Core, Packslip, Aqua, Github, Package Manager (cargo, npm, pipx)

[tools]
#* Main
"aqua:go-task/task" = "3.53.1" # Used for running tasks in IDE and CI
"cargo:templatry" = "0.2.0"    # Used for generating config files
#* Linting
"aqua:astral-sh/uv" = "0.12.19"        # Used for python (pipx) linting tools
"aqua:mikefarah/yq" = "4.53.6"         # Used for validating & formatting JSON & toml parsing
"aqua:tombi-toml/tombi" = "1.5.5"      # Used for validating & formatting TOML
"aqua:rvben/rumdl" = "0.2.77"          # Used for linting & formatting markdown
"aqua:loeffel-io/ls-lint" = "2.3.1"    # Used for enforcing folder & file naming conventions
"aqua:lycheeverse/lychee" = "0.24.2"   # Used for checking for dead links
"aqua:koalaman/shellcheck" = "0.11.0"  # Used for checking shell scripts
"aqua:mvdan/sh" = "3.14.1"             # Used for formatting shell scripts
"aqua:google/yamlfmt" = "0.21.0"       # Used for formatting YAML
"github:zizmorcore/zizmor" = "v1.30.1" # Used for statically analyzing github actions
"github:mongodb/kingfisher" = "v2.7.0" # Used for checking for leaked credentials & secrets
"github:kucherenko/jscpd" = "v5.3.2"   # Used for detecting code duplication
"pipx:yamllint" = "1.38.0"             # Used for linting YAML

[settings]
lockfile = true
