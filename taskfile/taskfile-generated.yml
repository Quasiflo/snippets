# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
# Code generated by scripts/generate_taskfile.sh — DO NOT EDIT.
# Sources: taskfile/scripts/*.sh (bash-only, shebang stripped, verbatim embed).
version: '3'
tasks:
  build_rust.sh:
    internal: true
    silent: true
    cmd: |
      # Build a Rust project for the host OS/arch Rust target triple.
      # Call with PROJECT_NAME set, e.g. `task build_rust PROJECT_NAME=myapp`.
      set -euo pipefail

      PROJECT_NAME="{{.PROJECT_NAME}}"
      if [[ -z ${PROJECT_NAME} ]]; then
      	echo "PROJECT_NAME is required (call with PROJECT_NAME=<name>)" >&2
      	exit 1
      fi

      # Resolve OS and arch
      OS=$(uname -s | tr '[:upper:]' '[:lower:]')
      case "$OS" in
      darwin) OS="apple" ;;
      linux) OS="linux" ;;
      *)
      	echo "Unsupported OS: $OS"
      	exit 1
      	;;
      esac

      ARCH=$(uname -m)
      case "$ARCH" in
      x86_64) ARCH="amd64" ;;
      aarch64 | arm64) ARCH="arm64" ;;
      *)
      	echo "Unsupported arch: $ARCH"
      	exit 1
      	;;
      esac

      # Resolve Rust target triple
      case "$OS-$ARCH" in
      linux-amd64) RUST_TARGET="x86_64-unknown-linux-musl" ;;
      linux-arm64) RUST_TARGET="aarch64-unknown-linux-musl" ;;
      apple-amd64) RUST_TARGET="x86_64-apple-darwin" ;;
      apple-arm64) RUST_TARGET="aarch64-apple-darwin" ;;
      *)
      	echo "Unsupported OS/arch combination: $OS-$ARCH"
      	exit 1
      	;;
      esac

      NAME="$PROJECT_NAME-$RUST_TARGET"
      TARBALL="release/$NAME.tar.gz"

      mkdir -p release

      # Install target & precompiled std & build release
      rustup target add "$RUST_TARGET"
      rustup component add rust-std --target "$RUST_TARGET"
      cargo build --release --target "$RUST_TARGET"

      tar -czf "$TARBALL" -C "target/$RUST_TARGET/release" "$PROJECT_NAME"
      echo "Created: $TARBALL"

      # Copy unpacked binary for downstream tasks (stable path, no re-resolution needed)
      mkdir -p tmp/binary
      cp "target/$RUST_TARGET/release/$PROJECT_NAME" "tmp/binary/$PROJECT_NAME"
      echo "Copied: tmp/binary/$PROJECT_NAME"
  notarize_macos.sh:
    internal: true
    silent: true
    cmd: |
      # Notarize a macOS binary with Apple notarytool.
      # Expects tmp/binary/PROJECT_NAME from the build_rust task.
      # Call with PROJECT_NAME set, e.g. `task notarize_macos PROJECT_NAME=myapp`.
      # Requires Apple/CircleCI credentials in the environment (provided by fnox).
      set -euo pipefail

      PROJECT_NAME="{{.PROJECT_NAME}}"
      if [[ -z ${PROJECT_NAME} ]]; then
      	echo "PROJECT_NAME is required (call with PROJECT_NAME=<name>)" >&2
      	exit 1
      fi

      : "${APPLE_API_KEY_CONTENT:?APPLE_API_KEY_CONTENT is required in the environment}"
      : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID is required in the environment}"
      : "${APPLE_ISSUER_ID:?APPLE_ISSUER_ID is required in the environment}"
      : "${CIRCLECI_PUBLISH_WEBHOOK_SECRET:?CIRCLECI_PUBLISH_WEBHOOK_SECRET is required in the environment}"

      mkdir -p tmp/binary
      zip -j "tmp/binary/$PROJECT_NAME.zip" "tmp/binary/$PROJECT_NAME"

      xcrun notarytool submit "tmp/binary/$PROJECT_NAME.zip" \
      	--key <(printf '%s\n' "$APPLE_API_KEY_CONTENT") \
      	--key-id "$APPLE_API_KEY_ID" \
      	--issuer "$APPLE_ISSUER_ID" \
      	--webhook "https://internal.circleci.com/private/soc/e/ea4e821d-3ab0-42a0-b760-cecae09c789b?secret=${CIRCLECI_PUBLISH_WEBHOOK_SECRET}" \
      	--output-format json
  validate_notarization.sh:
    internal: true
    silent: true
    cmd: |
      # Validate an Apple notarization result from a notarytool webhook payload.
      # Expects the raw webhook body in WEBHOOK_BODY and Apple credentials in the environment (provided by fnox). Fetches the submission log with rcodesign and fails unless the status is Accepted.
      set -euo pipefail

      : "${WEBHOOK_BODY:?WEBHOOK_BODY is required in the environment}"
      : "${APPLE_API_KEY_CONTENT:?APPLE_API_KEY_CONTENT is required in the environment}"
      : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID is required in the environment}"
      : "${APPLE_ISSUER_ID:?APPLE_ISSUER_ID is required in the environment}"

      # The raw body is available here
      echo "$WEBHOOK_BODY" | jq .

      # Extract submission ID (Apple's payload structure)
      SUBMISSION_ID=$(echo "$WEBHOOK_BODY" | jq -r '.payload.submission_id // .submission_id')

      # Confirm status using rcodesign
      rcodesign notary-log \
      	--api-key-file <(
      		rcodesign encode-app-store-connect-api-key \
      			-o /dev/stdout \
      			"$APPLE_ISSUER_ID" \
      			"$APPLE_API_KEY_ID" \
      			<(printf '%s\n' "$APPLE_API_KEY_CONTENT")
      	) "$SUBMISSION_ID" >notary-log.json

      STATUS=$(jq -r '.status // .attributes.status' notary-log.json)

      if [ "$STATUS" != "Accepted" ]; then
      	echo "Notarization failed: $STATUS"
      	cat notary-log.json
      	exit 1
      fi

      echo "Notarization Accepted"
